name: CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checking Docs folder
        run: |
          test -d "docs" || exit 1

      - name: Checking Required Files
        run: |
          test -f "docs/API Endpoint Plan(Updated).pdf" || exit 1
          test -f "docs/ERDDIAGRAM.drawio.png" || exit 1
          test -f "docs/Part 1.sql" || exit 1
          test -f "README.md" || exit 1

      - name: Checking SQL Structure
        run: |
          echo "Checking CREATE TABLE..."
          grep -qi "CREATE TABLE" "docs/Part 1.sql" || {
            echo "CREATE TABLE missing"
            exit 1
          }

          echo "Checking PRIMARY KEY..."
          grep -qi "PRIMARY KEY" "docs/Part 1.sql" || {
            echo "PRIMARY KEY missing"
            exit 1
          }

          echo "Checking FOREIGN KEY..."
          grep -qi "FOREIGN KEY" "docs/Part 1.sql" || {
            echo "FOREIGN KEY missing"
            exit 1
          }

          echo "All SQL structure checks passed."
