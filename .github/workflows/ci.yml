name: RaceDay CI (API and MVC)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify required Part 1 documentation
        run: |
          test -f "docs/Part 1.sql"
          test -f "docs/ERD-diagram.png"
          test -f "docs/API Plan.docx"
          test -f "docs/API-Plan.pdf"
          test -f "README.md"

      - name: Validate SQL schema requirements
        run: |
          grep -qi "CREATE[[:space:]]\+TABLE" "docs/Part 1.sql"
          grep -qi "PRIMARY[[:space:]]\+KEY" "docs/Part 1.sql"
          grep -qi "FOREIGN[[:space:]]\+KEY" "docs/Part 1.sql"
          grep -qi "CREATE TABLE Organisers" "docs/Part 1.sql"
          grep -qi "CREATE TABLE Participants" "docs/Part 1.sql"
          if grep -Eiq "\bAdmin\b" "docs/Part 1.sql"; then echo "Unexpected third application role"; exit 1; fi

      - name: Restore dependencies
        run: dotnet restore RaceDayPOE/RaceDayPOE.sln

      - name: Build solution
        run: dotnet build RaceDayPOE/RaceDayPOE.sln --configuration Release --no-restore

      - name: Build MVC web project (Part 3)
        run: dotnet build RaceDayPOE.Web/RaceDayPOE.Web.csproj --configuration Release --no-restore

      - name: Verify the MVC project has no direct database or Azure access
        run: |
          if grep -Eiq "EntityFrameworkCore|SqlClient|Azure\.Storage" RaceDayPOE.Web/RaceDayPOE.Web.csproj; then
            echo "The MVC project must not reference database or Azure packages"; exit 1
          fi
          if grep -rEq "DbContext|BlobServiceClient|BlobContainerClient" RaceDayPOE.Web --include=*.cs --exclude-dir=obj --exclude-dir=bin; then
            echo "The MVC project must not access the database or Azure directly"; exit 1
          fi

      - name: Verify Part 3 deliverables
        run: |
          test -f RaceDayPOE.Web/Dockerfile
          test -f docker-compose.yml
          grep -q "docker run" README.md

      - name: Run unit and integration tests
        run: dotnet test RaceDayPOE/RaceDayPOE.sln --configuration Release --no-build --logger "console;verbosity=normal"

  docker-build:
    name: Build MVC Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag raceday-web ./RaceDayPOE.Web

      - name: Smoke test the container starts
        run: |
          docker run -d --name raceday-web -p 8080:8080 -e Api__BaseUrl=http://localhost:5258/ raceday-web
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/Account/Login || true)
            [ "$code" = "200" ] && echo "Container is serving pages" && exit 0
            sleep 2
          done
          docker logs raceday-web
          exit 1
